name: 🧪 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call: {} # CD içinden reuse edebilmek için
  workflow_dispatch: {} # elle tetiklemek için

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8

      # Model gerekiyorsa testten önce üret (Hata çözümü için kritik)
      - name: Train and Optimize Model
        run: |
          python src/1_data_indirme.py
          python src/model_gelistirme.py
          python src/model_optimizasyon.py

      - name: Lint (code style)
        run: flake8 . --max-line-length=120

      - name: Run tests
        run: pytest -v
