name: "🧪 Sürekli Entegrasyon (CI)"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call: {}    # Re-usable workflow olarak çağrılabilsin diye

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8

      # Model dosyaları testlerde gerekiyorsa eğit
      - name: Train and Optimize Model
        run: |
          python src/1_data_indirme.py
          python src/model_gelistirme.py
          python src/model_optimizasyonu.py

      - name: Lint
        run: flake8 . --max-line-length=120

      - name: Run tests
        run: pytest -q
