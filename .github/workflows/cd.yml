name: "🚀 Sürekli Dağıtım (CD)"

on:
  push:
    tags: ['v*.*.*']   # örn: v1.2.3
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag (örn: v1.0.0 veya latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io

jobs:
  check_tests:
    uses: ./.github/workflows/ci.yml   # CI’ı yeniden kullan
    secrets: inherit

  build-and-push:
    needs: check_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # (İsteğe bağlı) Eğitim: imaj içine güncel model dosyalarının girmesini garanti eder
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install training deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train & Optimize Model (ensure artifacts exist in context)
        run: |
          python src/1_data_indirme.py
          python src/model_gelistirme.py
          python src/model_optimizasyon.py

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: img
        run: echo "name=${GITHUB_REPOSITORY@L}" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
